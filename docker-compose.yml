version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/database.db:/app/database.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend