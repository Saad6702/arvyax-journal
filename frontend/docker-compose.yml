version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend/database.db:/app/database.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
```

---

### File 4 — `.env.example`
Right-click on **root folder** → New File → name it `.env.example`

Paste this:
```
GEMINI_API_KEY=your_gemini_api_key_here